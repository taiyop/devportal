name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests (Go)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: src-wails/go.sum

      - name: Ensure frontend dist placeholder exists
        run: mkdir -p src-wails/frontend/dist && touch src-wails/frontend/dist/.gitkeep

      - name: Run Go tests
        working-directory: src-wails
        run: go test -v ./...

  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and Build
        run: bun run build
