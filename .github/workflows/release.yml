name: Release

on:
  push:
    tags:
      - '[0-9]*'
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build macOS DMG & Publish Release
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: src-wails/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build macOS DMG and Updater Package
        run: |
          cd src-wails
          wails3 task darwin:package:dmg
          wails3 task darwin:package:updater

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-wails/bin/*.dmg
            src-wails/bin/*.zip
            src-wails/bin/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
