name: Release

on:
  push:
    tags:
      - '[0-9]*'
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build macOS DMG & Publish Release
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src-wails/go.mod
          cache-dependency-path: src-wails/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Resolve app version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          if [ -z "$VERSION" ]; then
            echo "empty version from tag: ${TAG}" >&2
            exit 1
          fi
          CORE_AND_PRE="${VERSION%%+*}"
          if [[ "$CORE_AND_PRE" == *-* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi
          echo "tag=${TAG}"
          echo "APP_VERSION=${VERSION}"
          echo "IS_PRERELEASE=${IS_PRERELEASE}"
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=${IS_PRERELEASE}" >> "$GITHUB_ENV"

      - name: Build macOS DMG and Updater Package
        run: |
          cd src-wails
          echo "Building with APP_VERSION=${APP_VERSION}"
          wails3 task darwin:package:dmg APP_VERSION="${APP_VERSION}"
          wails3 task darwin:package:updater APP_VERSION="${APP_VERSION}"

      - name: Verify baked-in app version
        run: |
          PLIST="src-wails/bin/DevPortal.app/Contents/Info.plist"
          GOT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          if [ "$GOT" != "$APP_VERSION" ]; then
            echo "Info.plist version is ${GOT}, want ${APP_VERSION}" >&2
            exit 1
          fi
          echo "Info.plist CFBundleShortVersionString=${GOT}"

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-wails/bin/*.dmg
            src-wails/bin/*.zip
            src-wails/bin/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
