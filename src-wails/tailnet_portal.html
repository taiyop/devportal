<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DevPortal</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          16px/1.5 system-ui,
          sans-serif;
        --accent: #18549f;
        --border: #c9d2df;
        --canvas: #f4f7fb;
        --panel: #fff;
        --text: #172335;
        --quiet: #4e6076;
        --good: #187044;
        --warm: #855400;
        --bad: #a33737;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --accent: #a6caff;
          --border: #364358;
          --canvas: #111923;
          --panel: #1a2533;
          --text: #eff4fe;
          --quiet: #bbc9da;
          --good: #83d6a8;
          --warm: #efcb82;
          --bad: #ffa6a6;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--text);
      }
      main {
        max-width: 64rem;
        margin: auto;
        padding: clamp(1rem, 5vw, 3rem);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        border-bottom: 1px solid var(--border);
        padding-bottom: 1rem;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
        overflow-wrap: anywhere;
      }
      h1 {
        font-size: clamp(1.6rem, 5vw, 2.1rem);
      }
      h2 {
        font-size: 1rem;
        margin-bottom: 0.7rem;
      }
      h3 {
        font-size: 1rem;
      }
      section,
      .empty {
        margin-top: 1.6rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr));
        gap: 0.8rem;
      }
      article {
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
        min-width: 0;
        padding: 1rem;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        background: var(--panel);
      }
      .title,
      .actions {
        display: flex;
        align-items: center;
        gap: 0.65rem;
      }
      .actions {
        flex-wrap: wrap;
        margin-top: auto;
        justify-content: space-between;
      }
      .quiet {
        color: var(--quiet);
        font-size: 0.875rem;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
      }
      .status::before {
        content: "";
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: currentColor;
      }
      .running {
        color: var(--good);
      }
      .starting {
        color: var(--warm);
      }
      .error {
        color: var(--bad);
      }
      a {
        color: var(--accent);
      }
      a:hover {
        text-decoration-thickness: 2px;
      }
      button {
        font: inherit;
        font-size: 0.875rem;
        color: var(--text);
        cursor: pointer;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 0.45rem;
        padding: 0.45rem 0.7rem;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>DevPortal</h1>
        <a href="/">更新</a>
      </header>
      {{range .}}
      <section>
        <h2>{{.Name}}</h2>
        <div class="grid">
          {{range .Apps}}
          <article>
            <div class="title">
              {{if .Favicon}}<img
                src="{{.Favicon}}"
                width="22"
                height="22"
                alt=""
              />{{end}}
              <h3>
                <a href="{{.URL}}" target="_blank" rel="noopener noreferrer"
                  >{{.Name}}</a
                >
              </h3>
              {{if .Pinned}}<span class="quiet">ピン留め</span>{{end}}
            </div>
            {{if .Description}}
            <p class="quiet">{{.Description}}</p>
            {{end}}
            <div class="actions">
              <span class="quiet status {{.Status}}">{{.StatusLabel}}</span>
              <form method="post" action="{{.ActionURL}}">
                <button type="submit" aria-label="{{.Name}}を{{.ActionLabel}}">
                  {{.ActionLabel}}
                </button>
              </form>
            </div>
          </article>
          {{end}}
        </div>
      </section>
      {{else}}
      <p class="empty">この端末に公開されているアプリはありません。</p>
      {{end}}
    </main>
  </body>
</html>
